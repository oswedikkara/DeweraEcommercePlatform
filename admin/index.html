<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>DEWERA ? Private Vault Terminal</title>
  <link rel="stylesheet" href="style.css?v=3">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap');
    
    body {
      margin: 0;
      padding: 0;
      background: #FAF7F2 !important;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container {
      width: 100%;
      max-width: 380px;
      padding: 20px;
      box-sizing: border-box;
    }
    .login-box {
      background: #FFFFFF;
      border: 1px solid rgba(201, 169, 110, 0.3);
      padding: 50px 36px;
      box-shadow: 0 20px 50px rgba(17, 17, 17, 0.05);
      text-align: center;
      box-sizing: border-box;
    }
    .login-crest {
      width: 46px;
      height: 46px;
      background: #111111;
      color: #FAF7F2;
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.4rem;
    }
    .login-heading {
      font-family: 'Cinzel', serif;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: #111111;
      margin: 0 0 6px 0;
    }
    .login-caption {
      font-size: 0.68rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #736B63;
      margin: 0;
      font-weight: 500;
    }
    .login-line {
      width: 36px;
      height: 2px;
      background: #C9A96E;
      margin: 1.4rem auto 2.2rem;
    }
    .pass-input {
      width: 100%;
      border: 1px solid rgba(201, 169, 110, 0.4);
      background: #FAF7F2;
      padding: 13px 16px;
      font-size: 0.95rem;
      text-align: center;
      letter-spacing: 0.2em;
      font-family: inherit;
      outline: none;
      box-sizing: border-box;
      transition: all 0.25s ease;
      margin-bottom: 1.2rem;
    }
    .pass-input:focus {
      border-color: #111111;
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(201, 169, 110, 0.15);
    }
    .login-button {
      width: 100%;
      background: #111111;
      color: #FAF7F2;
      border: 1px solid #111111;
      padding: 13px 20px;
      font-size: 0.82rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 600;
      border-radius: 980px;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: inherit;
    }
    .login-button:hover {
      background: #8F7443;
      border-color: #8F7443;
      transform: scale(1.02);
    }
    .login-button:active {
      transform: scale(0.98);
    }
    .error-banner {
      color: #D70015;
      font-size: 0.75rem;
      margin-bottom: 1rem;
      display: none;
      font-weight: 500;
    }
    .footer-secure {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #8E8E93;
      margin-top: 2rem;
    }
    .shake-card {
      animation: shake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }
    @keyframes shake {
      10%, 90% { transform: translateX(-3px); }
      20%, 80% { transform: translateX(5px); }
      30%, 50%, 70% { transform: translateX(-5px); }
      40%, 60% { transform: translateX(5px); }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-box" id="loginCard">
      <div class="login-crest">D</div>
      <h1 class="login-heading">DEWERA</h1>
      <p class="login-caption">Private Atelier &bull; Management</p>
      <div class="login-line"></div>

      <form id="loginForm" onsubmit="handleStaffLogin(event)">
        <div style="margin-bottom: 0.9rem; text-align: left;">
          <label style="display: block; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.12em; color: #736B63; margin-bottom: 4px; font-weight: 600;">Staff Username</label>
          <input 
            type="text" 
            id="usernameInput" 
            class="pass-input" 
            placeholder="e.g. headadmin or custom admin" 
            value=""
            style="text-align: left; letter-spacing: 0.05em; margin-bottom: 0.6rem; padding: 11px 14px; font-size: 0.88rem;"
            required 
            autofocus
          >
        </div>

        <div style="margin-bottom: 1.4rem; text-align: left;">
          <label style="display: block; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.12em; color: #736B63; margin-bottom: 4px; font-weight: 600;">Vault Passcode</label>
          <input 
            type="password" 
            id="passwordInput" 
            class="pass-input" 
            placeholder="Enter encrypted passcode" 
            value=""
            style="text-align: left; letter-spacing: 0.1em; margin-bottom: 0; padding: 11px 14px; font-size: 0.88rem;"
            required
          >
        </div>

        <div id="errorMsg" class="error-banner">
          Invalid credentials. Access rejected.
        </div>

        <button type="submit" class="login-button" id="loginBtn">
          Authenticate Access
        </button>
      </form>

      <div class="footer-secure">
        Private Gateway &bull; Encrypted Session
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
  <script>
    if (sessionStorage.getItem('dewera_staff_token')) {
      window.location.href = 'dashboard.html';
    }

    async function handleStaffLogin(e) {
      e.preventDefault();
      const username = document.getElementById('usernameInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const card = document.getElementById('loginCard');
      const errorMsg = document.getElementById('errorMsg');
      const btn = document.getElementById('loginBtn');

      btn.disabled = true;
      btn.innerText = 'Verifying...';

      try {
        const res = await fetch('/api/staff/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success && data.token) {
          // Store token and public metadata only - NEVER store password or hash
          sessionStorage.setItem('dewera_staff_token', data.token);
          sessionStorage.setItem('dewera_staff_role', data.user.role);
          sessionStorage.setItem('dewera_staff_username', data.user.username);
          sessionStorage.setItem('dewera_staff_name', data.user.name);
          sessionStorage.setItem('dewera_admin_authenticated', 'true'); // legacy support
          window.location.href = 'dashboard.html';
        } else {
          showError(data.error || 'Access Denied.');
        }
      } catch (err) {
        showError('Network error connecting to Vault terminal.');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Authenticate Access';
      }
    }

    function showError(msg) {
      const errorMsg = document.getElementById('errorMsg');
      const card = document.getElementById('loginCard');
      errorMsg.innerText = msg;
      errorMsg.style.display = 'block';
      card.classList.remove('shake-card');
      void card.offsetWidth;
      card.classList.add('shake-card');
    }
  </script>
</body>
</html>
